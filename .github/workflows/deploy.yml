name: Test and deploy to HuggingFace Spaces

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The hf CLI is pinned: huggingface/hub-sync@v0.1.0 installed the latest
      # CLI and broke when `hf repo` was renamed to `hf repos`. The Space
      # already exists, so only the upload (a mirror of the repo) is needed.
      - name: Install Hugging Face CLI
        run: pip install "huggingface_hub[cli]==2.4.0"

      - name: Sync to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload Jayywestty/FraudDetection-ML . . \
            --repo-type space \
            --exclude ".git*" \
            --exclude ".github*" \
            --delete "*" \
            --commit-message "Sync from GitHub ${GITHUB_SHA::7}"
